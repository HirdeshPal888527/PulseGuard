version: "3.8"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
      POSTGRES_DB: anomaly_engine
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly"]
      interval: 5s
      timeout: 5s
      retries: 10

  producer:
    build: ./producer
    container_name: event-producer
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      TOPIC: transactions
      EVENTS_PER_SEC: "500"
    restart: unless-stopped

  spark-processor:
    build: ./spark
    container_name: spark-processor
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      TOPIC: transactions
      PG_HOST: timescaledb
      PG_DB: anomaly_engine
      PG_USER: anomaly
      PG_PASSWORD: anomaly
    restart: unless-stopped

  api:
    build: ./api
    container_name: anomaly-api
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PG_HOST: timescaledb
      PG_DB: anomaly_engine
      PG_USER: anomaly
      PG_PASSWORD: anomaly
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: anomaly-dashboard
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  timescale_data:
